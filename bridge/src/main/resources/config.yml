# Existing inventory menus remain available. No scoreboard is created by the bridge.
network-events:
  enabled: true
  # ALL shows network-wide events; LOCAL shows only the current backend's events.
  scope: ALL
  ttl-seconds: 15
  max-lines: 3
  show-waiting: true
  hide-local-hcf-timers: true
  format: "&6&l{event} &7({server}) &7» &f{time}"
  waiting-text: "Reiniciando"
  labels:
    SOTW: SOTW
    EOTW: EOTW
    RESTART: Reinicio
hcf-timers:
  enabled: true
  interval-ticks: 100
# /pulsebridge reload (pulsebridge.admin)
